name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Build C++ Vectorized Engine
      run: |
        make csrc

    - name: Run Power of 10 AST Safety Audit
      run: |
        make audit

    - name: Run Test Suite
      run: |
        PYTHONPATH=src pytest tests/ -v

    - name: Run Live Benchmark Demo
      run: |
        PYTHONPATH=src python -m symbolic_alpha.cli demo
