[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "symbolic-alpha-synthesizer"
version = "0.1.0"
description = "Deterministic C++20 and Genetic Symbolic Expression Engine for Quantitative Mathematical Alpha Discovery"
readme = "README.md"
authors = [{ name = "Ishant Panchal", email = "ishant.p@somaiya.edu" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pandas>=2.1.0",
    "pyarrow>=14.0.0",
    "click>=8.1.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
symbolic-alpha = "symbolic_alpha.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]
